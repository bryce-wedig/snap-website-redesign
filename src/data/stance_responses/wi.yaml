- candidate_first_name: Mark
  candidate_last_name: Scheffler
  state: wi
  race: US House of Representatives
  district: 8
  party: Democratic
  question: wi-q1
  date: 2026-07-10
  primary_candidate: false
  response: |
    Mark supports the development of artificial intelligence engines but only with iron-clad regulations to protect human wellbeing, jobs, data privacy, and of course environmental protections. He's proposing a 1-year moratorium on all new AI data center construction to give policymakers time to develop a regulatory framework to ensure that this powerful technology benefits humanity, is ecologically friendly, and can be powered entirely by 24/7 renewable energy created right here in America. He also supports strong water quality protections and the use of closed-loop geothermal cooling systems.

    KEYWORDS: climate change, renewable energy, clean water

- candidate_first_name: Mark
  candidate_last_name: Scheffler
  state: wi
  race: US House of Representatives
  district: 8
  party: Democratic
  question: wi-q2
  date: 2026-07-10
  primary_candidate: false
  response: |
    Mark is the only candidate in this Congressional race supporting the creation of the world's largest renewable biomass market powered by America's farmers. This plan builds on the excellent work being done at UW's agriculture school and would support the production of renewable biomass for 24/7 electrical generation, bio-fuels (including sustainable aviation fuel - SAF), bio-plastics, building materials, paper products, textiles, etc.. Wisconsin has the resources, Wisconsin has the talent; we just need fresh, independent leaders to think long-term again.

    KEYWORDS: biomass, agriculture, next-generation, bio-fuels, renewable energy

- candidate_first_name: Mark
  candidate_last_name: Scheffler
  state: wi
  race: US House of Representatives
  district: 8
  party: Democratic
  question: wi-q2
  date: 2026-07-10
  primary_candidate: false
  response: |
    As the only candidate in this 8th Congressional District race who has taught full-time in a Wisconsin public school, Mark brings a wealth of experience and expertise. He supports educational choice exclusively through public charter schools, his tax modernization plan (#TinyTax) would keep more than $20 billion per year in our local and Wisconsin economy which would be use to increase funding for our shared public infrastructure, including public schools. He also supports a massive increase in funding for the arts and humanities to offset the effects of artificial intelligence and to strengthen student understanding, curiosity, creativity and achievement. Lastly, he supports equalizing funding for schools across rural Wisconsin, winding down our broken voucher program, and supporting job training for advanced manufacturing across the state. 

    KEYWORDS: public charter schools, tax reform, rural education

- candidate_first_name: Mark
  candidate_last_name: Scheffler
  state: wi
  race: US House of Representatives
  district: 8
  party: Democratic
  question: wi-q5
  date: 2026-07-10
  primary_candidate: false
  response: |
    America must continue to lead on scientific research, and must always lead all policy decisions at the local, state, federal and international levels. And this includes not only physical science, but most especially social science research that can help us make better policy decisions designed to help improve human and environmental wellbeing. Mark believes that public policy should never be driven by religion, mythology, tribalism, nor by intuition. While there are certainly areas of human endeavor that can include these concepts, public policy should never be one of them.  

    KEYWORDS: objectivity, social science, scientific discovery, prosperity, human wellbeing

