  response: |
    Mark's tax reform proposal (#TinyTax) would fully fund all spending allocated by Congress in the 2022-24 budget, including fully funding the Centers for Disease Control, the National Institute on Health, the National Academy of Science, NASA, et.al.. Mark believes strongly that impounding Congressional spending by the executive branch is bth unconstitutional and outright unworkable and he supports strengthening the separation of powers between Congress and the Executive Branch. He also supports minimizing Presidential executive orders as a means of instituting public policy. 

    KEYWORDS: #TinyTax, NIH, CDC, NASA