  question: ct-q5
  date: 2026-07-07
  primary_candidate: false
  response: |
    The rapidly developing technology of artificial intelligence has the potential of enhancing productivity, fostering innovation, and driving efficiency across nearly all industries. It also carries significant risks for workers, as it can potentially erode accountability, representation, and labor protections. 

    Generally speaking, I want workers to learn how to use AI as a tool in how they can do their work more efficiently. AI should not be used by management to displace workers. We must position our  economy to take advantage of artificial intelligence’s many breakthrough opportunities, while ensuring that this powerful technology is also used safely and responsibly, without hurting worker’s rights. 

    This session, I supported and signed legislation regulating automated monitoring and surveillance for warehouse workers. In addition, I worked with Senator Maroney to pass legislation that makes sure workers know when AI is used to make employment-related decisions. Humans should be making the final decision in that process. The legislation also makes sure that employers cannot use AI to try to avoid our anti-discrimination laws. 


