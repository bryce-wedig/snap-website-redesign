    We can address rising costs of energy in Connecticut by breaking up large utilities into publicly owned energy sectors that would save customers money by not having to subsidize the profit these companies seek. We need to pursue avenues of generating more electricity in an environmentally and economically savvy manner. There needs to be great investment in wind and solar energy. The Revolution Wind offshore wind initiative is a great example of expanding wind energy. We can also expand solar energy by making it easier and cheaper to install solar panels on homes and businesses by getting rid of permitting barriers that would enable easy-to-install, small-scale solar for renters and homeowners without requiring permits or rooftop installation. We should also be creating incentives for businesses to have solar panels placed on their property to avoid using open space for solar farms. I am not in favor of nuclear power. It is not as cost effective and is environmentally problematic. The National Public Utilities Council’s Levelized cost of electricity shows that solar and wind energy is 50% cheaper or higher. Nuclear fission, although zero-carbon emission, still produces radioactive waste, thermally pollutes the surrounding water, and uranium extraction can disrupt local habitats.

