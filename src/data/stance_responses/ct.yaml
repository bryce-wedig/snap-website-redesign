    Environmental policy should focus on urban greenspaces that include native plants to support biodiversity and local gardens providing climate-friendly food. We need to pursue environmental restoration in frontline communities, especially along the coast for the effects of climate change we cannot prevent. Preservations and restoration of salt marshes need to be a priority, both for conservation of biodiversity and their capacity to mitigate coastal flooding. I would form a task force on microplastics to present legislation to study and reduce impacts, find ways to reduce dependency on single-use plastics, and fund research for plastic alternatives. Increase funding and expand research to identify important habitats for imperiled species and expand protections for those habitats. Industries take an immense toll on biodiversity by driving resource extraction that destroys and degrades natural ecosystems. We need to reduce the demand for extraction of natural resources. I would introduce legislation that will shift us toward a more circular economy, wherein food and material waste is reduced, and resources are used and reused more efficiently. I would also work with the Nature Conservancy to draft legislation that supports the “30 x 30” framework to protect 30% of the planet’s oceans, lands, and freshwaters by 2030. 

