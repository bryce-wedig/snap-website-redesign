    "Education is one of the greatest tools for economic mobility in America, and equal access to education has been a top priority for me as a Maryland State Delegate. To achieve the goal of high-quality, debt-free higher education, I believe
    we should be providing tuition-free higher education at public universities, and support provisions that provide Federal student debt relief for graduates currently struggling with debt. I would champion how Maryland can also strengthen its science and STEM pipeline by using evidence-based policy to reduce inequities, remove transfer barriers, and improve affordability for students. I would endorse key K–12 strategies to include aligning computer science and STEM standards (such as the Maryland Robotics Grant Program) across Local Education Agencies (LEAs) and expanding early Career and Technical Education (CTE) certifications and dual-enrollment opportunities to expose students to STEM pathways before college.

    My agenda includes efforts to improve the quality of K–12 public education by investing in schools, increasing teacher pay, and expanding programs that help students succeed; increase funding to Title I, the country’s largest federal K-12
    program; restore and expand student loan forgiveness and protect income-driven repayment programs so working families aren’t crushed by lifelong debt; invest in community colleges, trade schools, and apprenticeship programs across
    Maryland’s Fifth to ensure strong, diverse, and affordable pathways to good-paying jobs; and secure federal investments for Maryland’s four HBCUs to strengthen programs, modernize campuses, and expand opportunity for students across the state. With the recent endorsements of National Education Association (NEA) and Maryland State Education Association (MESA), I am firmly committed to the “grassroots movement we are building, led by educators, community leaders and residents who understand what’s at stake in this election, and who are ready to usher in a new generation of leadership to Congress to fight for working families."

