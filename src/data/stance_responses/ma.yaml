    I believe our government's job isn't to subsidize corporate automation; it is to protect the working class. As a Representative, I support specific, aggressive forms of AI regulation focused on: protecting Union Jobs and Labor: such as strict legislation that prevents corporations from using AI to unilaterally automate away good-paying, unionized jobs or to lower wages. AI should be a tool that assists human workers, not an excuse to mass-lay off the people who power our economy. As well as banning biased algorithmic discrimination, we must regulate AI tools used in corporate hiring, housing applications, and loan approvals, which have consistently been shown to bake in racial and economic biases and worker surveillance guardrails: I will fight to outlaw invasive, AI-driven electronic surveillance and data tracking used by mega-corporations to police workers on the job. My goal is to draw the line at protecting human capital. "Innovation" is meaningless if it leaves thousands of working families paycheck to paycheck while funneling millions to tech billionaires. Necessary oversight means ensuring that technological growth serves the common good and is shaped by workers and labor unions.

