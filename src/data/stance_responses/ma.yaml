    Massachusetts has some of the best healthcare education programs in the country, but too many students face barriers to completing their training, and too many communities struggle to recruit and retain healthcare providers. We need solutions that strengthen both education and patient care.

    I have proposed a pilot program that encourages experienced Physician Assistants (PAs) and Nurse Practitioners (NPs) to become clinical preceptors. Clinical placements are one of the biggest bottlenecks in training new providers. By supporting more preceptorships, we can expand opportunities for graduate students and help prepare the next generation of healthcare professionals.

    I also support a service-based scholarship program that would provide tuition-free PA education at Massachusetts public colleges and universities. In exchange, graduates would commit to five years of service in public healthcare within the Commonwealth. Those who choose not to fulfill that commitment would repay the cost of their education.

    These proposals reduce financial barriers, expand hands-on training opportunities, and help address critical workforce shortages while ensuring taxpayers receive a clear return on their investment. I believe this type of partnership—investing in students while asking for a commitment to serve—is a practical, fiscally responsible way to strengthen our healthcare workforce and improve access to care for communities across Massachusetts.

