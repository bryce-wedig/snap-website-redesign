    For too long, the political establishment has allowed corporate interests, luxury developers, and private polluters to compromise our public commons. Clean water, thriving state parks, and protected open spaces are fundamental rights that belong to every working-family, not bargaining chips for the wealthy. We must fund a modern Civilian Climate Corps to put local residents to work restoring our state parks, expanding open-space preserves, and building resilient flood protections in our coastal and river communities. This ensures conservation translates directly into high-wage, union jobs. Additionally, land and water management policies must prioritize communities that have historically borne the brunt of pollution and industrial neglect. I support strict federal oversight to protect our clean water supplies from corporate chemical dumping (like PFAS contamination) and will fight to ensure that green open spaces are heavily expanded in urban and working-class neighborhoods, not just affluent suburbs. I strongly oppose the privatization of public lands and the selling off of open spaces to luxury real estate developers. Our parks and preserves must remain permanently protected public trusts, fully funded by federal and state investments rather than reliance on corporate donors. I will fight to reallocate resources away from corporate handouts and toward the preservation of our land, ensuring our natural resources are protected for generations to come.

