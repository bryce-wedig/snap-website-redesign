    As I have indicated on my website, pachecoforthepeople.com Access to affordable, quality healthcare should be a basic expectation for every resident of Massachusetts. I support the goal of healthcare for all and believe we can continue moving toward a system where cost is not a barrier to getting the care people need.
    At the same time, we should take practical steps to improve affordability and access today. I support expanding programs that reduce prescription drug costs, strengthen primary care,(like my NPs and PAs pilot program) investing in behavioral health services, and addressing healthcare workforce shortages, (PCA’s, Nurses and more)  that create delays and limited access in many communities.
    We also need to ensure that rural and underserved communities are not left behind. Supporting community health centers, expanding telehealth options, and developing innovative workforce programs can help bring care closer to the people who need it most.
    A healthcare system should focus on patients, not just costs. As we continue working toward broader healthcare access, we must also protect healthcare workers and provide support for those whose jobs may be affected by changes in the industry.
    My goal is a healthcare system that is affordable, accessible, and sustainable, one that provides quality care to every resident while being responsible with taxpayer resources.

