    Your health should never be a source of financial ruin. Right now, the political establishment accepts hundreds of thousands of dollars from Big Pharma and private health insurance HMOs, leaving us with a system rigged to prioritize corporate profits over human lives. Too many working families in Massachusetts’s 5th District are forced to ration lifesaving medication or skip doctor visits because of out-of-control premiums, deductibles, and co-pays. I fully support a single-payer, universal Medicare for All system. Healthcare is a fundamental right, not a commodity. We must eliminate the private insurance middleman to ensure every constituent has comprehensive coverage that is completely free at the point of service: covering medical, dental, vision, mental health, and reproductive care with zero deductibles or co-pays. Additionally, I will fight for robust antitrust laws to break up healthcare monopolies and give the federal government the absolute authority to negotiate all prescription drug prices. No senior or working-class family should be forced to choose between buying groceries and paying for insulin while pharmaceutical executives rake in record billions. True access requires robust public infrastructure. I support significantly expanding federal funding for regional community health centers, mental health clinics, and mobile health units, particularly in our underserved and working-class neighborhoods. Furthermore, we must protect and empower our frontline healthcare workers by ensuring safe staffing ratios, fair wages, and the universal right to unionize. We have the money to fund a humane, compassionate healthcare system. I will vote to reallocate excessive military funding and corporate tax loopholes directly into our local public health systems, schools, and affordable housing, because true public safety and wellness start by meeting people’s basic material needs. I will not accept corporate PAC money, which means my only obligation in Washington will be to the health and well-being of working families, not insurance company boardrooms.
