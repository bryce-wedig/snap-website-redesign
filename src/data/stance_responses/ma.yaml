    The fundamental question is who is this innovation actually serving? Right now, the billionaire class and corporate monopolies are co-opting public resources. Taxpayers fund groundbreaking research at our universities, only for Big Pharma and Silicon Valley to privatize the patents, jack up prices, and shut out working families. I will fight for a research ecosystem centered on moral clarity, worker power, and public equity. Such as, Funding the Public Good: I will fight to expand federal funding for foundational science through the NSF and NIH. However, public dollars must come with public-interest conditions. If taxpayer money funds a medical breakthrough or a green technology, the resulting patents must remain affordable and accessible to everyone, not locked behind a corporate paywall. Secondly, democratizing opportunity where talent is distributed evenly, but opportunity is not. We must diversify federal research investments away from just elite institutions and toward public universities, regional hubs, and minority-serving institutions (MSIs), creating a diverse, localized STEM pipeline. Lastly, pro-Worker oversight oversight shouldn't mean bureaucratic red tape for scientists; it means putting strict ethical guardrails on emerging tech like advanced AI

