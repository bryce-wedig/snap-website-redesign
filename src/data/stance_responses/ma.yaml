    Massachusetts’ land-based resources are some of our greatest assets, and we have a responsibility to protect them for future generations. I support policies that balance responsible growth with preserving the character, natural resources, and quality of life that make our communities special.
    I have publicly opposed misplaced large-scale development that do not consider the impact on our roads, infrastructure, water resources, environment, and surrounding neighborhoods, and will continue to do so. Development must be thoughtful, properly planned, and aligned with the needs and capacity of the community, not simply driven by short-term interests and development profits/real estate profits.
    I strongly support protecting open spaces, farmland, and right-to-farm communities. These areas provide environmental benefits, support local agriculture, preserve our history, and contribute to the unique identity of our towns. We need to continue investing in programs that help communities preserve conservation land, support farmers, and maintain access to parks and outdoor spaces.
    Protecting our water resources must also be a priority. I support investments in modern wastewater infrastructure, including replacing aging systems that contribute to environmental challenges and implementing solutions that reduce or eliminate nitrogen from groundwater discharge. These improvements protect drinking water, coastal ecosystems, and the long-term health of our communities. This is currently a issue that is very real and very soon for my district.
    As our state grows, we have to make decisions that allow for economic opportunity while protecting the places that make the state and my district,  great places to live. Smart planning and responsible investment today will ensure future generations inherit communities that are both thriving and sustainable.

