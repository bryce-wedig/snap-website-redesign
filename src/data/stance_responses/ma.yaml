    Every student deserves the opportunity to pursue higher education without worrying that the cost will put their future out of reach. That's why I strongly support continued funding for free community college. It's one of the best investments Massachusetts can make in our people, our workforce, and our economy. Whether someone is graduating from high school, changing careers, returning to school after raising a family, or serving our country, community college should remain an affordable path to success.

    We can do more than just make tuition affordable. I want to expand need-based financial aid, strengthen apprenticeship and internship opportunities, and encourage partnerships between our colleges, unions, vocational schools, and local employers. When students can earn valuable experience while they're learning, they graduate with less debt and stronger job prospects.

    I also support targeted loan repayment or tuition assistance for graduates who choose careers where Massachusetts has the greatest need, such as teaching, nursing, behavioral health, and public safety. Helping graduates stay and work in our communities benefits everyone.

    I believe education is one of the best investments we can make. By continuing to support free community college and creating more affordable pathways to good-paying careers, we can give more people the chance to succeed while building a stronger Commonwealth for the future.

