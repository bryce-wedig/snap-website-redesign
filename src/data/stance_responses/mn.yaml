    “Every one of those numbers is a neighbor. The Eighth District is home to several Ojibwe nations, so the disparity in your question is not a statistic to me. It is families in my district burying their kids. The decline proves something works. Naloxone saves lives, so keep it cheap and everywhere, including schools, bars, and squad cars. Treatment works when you can actually get it, so my first priority is rural access. In much of my district the nearest detox bed or medication-assisted treatment provider is an hour or more away. That kills people. Second, fund tribal nations directly. Tribes run some of the most effective recovery programs in Minnesota because they built them for their own communities. Money should go straight to them, not through layers of agencies that skim and slow it. Third, hit supply hard. Fentanyl traffickers and the Chinese precursor pipeline deserve prosecution, not the addict who needs a bed. Fourth, follow the evidence. If a program saves lives, fund it. If it does not, cut it. I take no pharmaceutical PAC money, so I can back what works instead of what pays.” 
    
    KEYWORDS: naloxone, rural treatment access, tribal nations

