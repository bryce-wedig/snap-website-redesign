  response: |
    “Research pays. As a farmer I benefit every season from work done at land grant universities. Disease resistant crops, soil science, pollinator research that keeps beekeepers like me in business. The NIH numbers in your question tell the same story in medicine. This is one of the few places government spends a dollar and gets more than a dollar back. Here is my problem. Congress cannot fund research reliably because Congress cannot budget at all. Continuing resolutions, shutdown threats, and last minute deals whiplash every lab in the country. Scientists spend their time writing grant applications instead of doing science because nobody knows what next year looks like. My policies. Stable multi-year funding for core research agencies so labs can plan. Grants awarded on merit and open competition, not on which university hired the better lobbyist. Full public transparency on where every research dollar goes, because taxpayer confidence is what keeps the money flowing. And my CAPT Act suspends congressional pay when Congress fails to pass a real budget, because the biggest threat to American research is not any one cut. It is a Congress that will not do its job.” 
    
    KEYWORDS: merit-based grants, CAPT Act, congressional accountability

- candidate_first_name: Anthony
