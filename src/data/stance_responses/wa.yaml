    I would also prioritize wastewater upgrades where nutrients, temperature, or contaminants affect fish and shellfish habitat. Scientific monitoring should include stream temperature sensors, salmon return counts, ocean acidification buoys, dissolved oxygen testing, shellfish health monitoring, forage fish surveys, and eelgrass mapping. Those are the types of data that help managers act early instead of guessing after damage is done.

    For communities, I would support grants and technical help for tribes, ports, shellfish growers, fishing families, farmers, and small cities to adapt to closures, habitat changes, flooding, and warmer water. Hatcheries have a role, but they must be managed carefully and based on science.

    KEYWORDS: habitat, monitoring, accountability

