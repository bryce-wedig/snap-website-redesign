- author: "Connor Schmidt"
  title: "Cucurbit[n]uril-type molecular containers."
  journal: "Nature Reviews. Methods Primers"
  date: "2026"
  citation: "Kraft, A., Schmidt, C. R., Akakpo, C., Biedermann, F., Webber, M. J., & Isaacs, L. (2026). Cucurbit[n]uril-type molecular containers. Nature Reviews. Methods Primers, 6(1). https://doi.org/10.1038/s43586-026-00495-2"
  doi: "https://doi.org/10.1038/s43586-026-00495-2"
  category: "Chemistry"
  disciplines: "Supramolecular Chemistry"
  summary: "A review of methods of making and using cucurbituril molecules which are short cylindrical / ring shaped molecules which bind small guest molecules as guests in their cavities. These hold the guest molecules tightly but not permanently, and are used in highly sensitive and selective sensors, flexible but specific bioimaging agents, and to make unique materials used in separations and catalysis, removal of toxic materials, and powerful drug delivery applications, among further applications."
