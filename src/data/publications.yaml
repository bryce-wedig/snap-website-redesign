- author: "Sarah Berretta"
  title: "Associations Between Area Deprivation and Paranoia in Serious Mental Illness"
  journal: "Schizophrenia Bulletin"
  date: "10/25/2025"
  citation: "Berretta, S. A., Ackerman, R. A., Moore, R. C., Depp, C. A., Harvey, P. D., Nagendra, A., & Pinkham, A. E. (2025). Associations between area deprivation and paranoia in serious mental illness. Schizophrenia Bulletin. Advance online publication. https://doi.org/10.1093/schbul/sbaf193"
  doi: "https://doi.org/10.1093/schbul/sbaf193"
  category: "Psychology"
  disciplines: "Psychology, Social epidemiology"
  summary: "There is a well established link between environment and paranoia in the general population and in people at high risk for psychosis. What hadn't been directly tested is whether that same relationship holds in people already diagnosed with serious mental illness. This study used data from 293 participants with schizophrenia or bipolar disorder across three sites; we found that worse neighborhood conditions, measured by the Area Deprivation Index, were linked to higher paranoia both in clinician ratings and in daily phone check-ins. The pattern did not show up for hallucinations, suggesting something specific about the environment-paranoia link. People from racial backgrounds other than White had both higher neighborhood deprivation and higher paranoia, and the neighborhood conditions explained a significant portion of that racial difference in symptomatology. The takeaway is that paranoia isn't just an internal symptom, it also reflects where someone lives, which means improving neighborhood conditions could be a potential pathway to reducing it."
  abstract: "Background and Hypothesis Though linked to paranoia in the general population and high-risk groups, neighborhood deprivation remains underexplored in serious mental illness. Paranoia also varies by demographic subgroup, potentially reflecting exposure to place-based disadvantage. Advances in the measurement of neighborhood deprivation and momentary experiences of suspiciousness could shed light on these relationships. This study uses neighborhood-level data to examine associations between area deprivation and paranoia in schizophrenia spectrum disorders (SSDs) and bipolar disorder (BD). Study Design Data from 293 participants with SSD (n = 148) and BD (n = 145) from three US sites were analyzed. Neighborhood disadvantage was quantified using the National Area Deprivation Index (ADI). Clinician-rated paranoia was assessed using the Positive and Negative Syndrome Scale; momentary feelings of threat/suspiciousness (MFTS) was measured across 30 days of Ecological Momentary Assessments (EMAs). Analyses examined the relationships between ADI and paranoia and tested if ADI explains observed demographic differences in paranoia. To assess specificity, hallucinations were examined in parallel. Study Results Greater neighborhood disadvantage was associated with higher clinician-rated paranoia and MFTS; no association was observed for hallucinations. Participants with SSD and those with racial backgrounds other than White had higher ADI scores and higher paranoia. The ADI-paranoia relationship did not differ in strength across clinical or demographic groups, nor across study sites. Area Deprivation Index significantly mediated the association between racial background and paranoia. Conclusions Neighborhood deprivation is associated with paranoia but not hallucinations, supporting a specific link between environment and paranoia. Improvement of neighborhood-level conditions may offer a pathway to reducing paranoia and improving functioning."

