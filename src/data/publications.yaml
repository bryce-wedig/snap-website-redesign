# Member publications register.
#
# Source of truth is the maintained Google Sheet
# "SNAP Published Scientific Papers -> Scientific Journal Articles"; this file is
# its export, one entry per paper, fields named after the sheet's columns.
# Values are stored as the sheet records them — normalization (discipline
# splitting and capitalization, date display, DOI URLs, author highlighting)
# happens at build time in src/lib/publications.ts.
#
# To add a paper: append an entry with the same keys. `summary` (the member's
# plain-language "Science for Society" text) and `abstract` may be empty.

- author: "Mikayla Smith-Craven"
  title: "Enhanced Dissolution of Amphotericin B through Development of Amorphous Solid Dispersions Containing Polymer and Surfactants"
  journal: "Journal of Pharmaceutical Sciences"
  date: "5/1/2024"
  citation: "Smith-Craven, M. M., Dening, T. J., Basra, A. K., & Hageman, M. J. (2024). Enhanced dissolution of amphotericin B through development of amorphous solid dispersions containing polymer and surfactants. Journal of Pharmaceutical Sciences, 113(8), 2454–2463."
  doi: "https://doi.org/10.1016/j.xphs.2024.04.031"
  category: "Biological and Chemical Sciences"
  disciplines: "Pharmaceutical Chemistry; Drug Delivery"
  summary: ""
  abstract: "Amphotericin B (AmB) is the gold standard for antifungal therapy; however, its poor solubility limits its administration via intravenous infusion. A promising formulation strategy to achieve an oral formulation is the development of amorphous solid dispersions (ASDs) via spray-drying. Inclusion of surfactants into ASDs is a newer concept, yet it offers increased dissolution opportunities when combined with a polymer (HPMCAS 912). We developed both binary ASDs (AmB:HPMCAS 912 or AmB:surfactant) and ternary ASDs (AmB:HPMCAS 912:surfactant) using a variety of surfactants to determine the optimal surfactant carbon chain length and functional group for achieving maximal AmB concentration during in vitro dissolution. The ternary ASDs containing surfactants with a carbon chain length of 14 ± 2 carbons and a sulfate functional group increased the dissolution of AmB by 90-fold compared to crystalline AmB. These same surfactants, when added to a binary ASD, however, were only able to achieve up to a 40-fold increase, alluding to a potential interaction occurring between excipients or excipient and drug. This potential interaction was supported by dynamic light scattering data, in which the ternary formulation produced a single peak at 895.2 dnm. The absence of more than one peak insinuates that all three components are interacting in some way to form a single structure, which may be preventing AmB self-aggregation, thus improving the dissolution concentration of AmB."

- author: "Erin Cullinane"
  title: "Upregulation of an Epithelial miRNA Is Associated with Immune Evasion in Progressive Bronchial Premalignant Lesions"
  journal: "cancer immunology research (AACR)"
  date: "4/2/2026"
  citation: "Boting Ning, Darren J. Chiu, Roxana M. Pfefferkorn, Erin Cullinane, Yohana Kefella, Erin Kane, Valerie Reyes-Ortiz, Gang Liu, Xiaohui Zhang, Hanqiao Liu, Lila Sultan, Emily Green, Myrtha Constant, Avrum E. Spira, Joshua D. Campbell, Mary E. Reid, Xaralabos Varelas, Eric J. Burks, Marc E. Lenburg, Sarah A. Mazzilli, Jennifer E. Beane; Upregulation of an Epithelial miRNA Is Associated with Immune Evasion in Progressive Bronchial Premalignant Lesions. Cancer Immunol Res 1 April 2026; 14 (4): 689–707. https://doi.org/10.1158/2326-6066.CIR-25-0431"
  doi: "https://aacrjournals.org/cancerimmunolres/article/14/4/689/776519/Upregulation-of-an-Epithelial-miRNA-Is-Associated"
  category: "Biological and Chemical Sciences"
  disciplines: "Lung Squamous Cell Carcinoma, Cancer Immunology"
  summary: "Bronchial premalignant lesions (PML), precursors of lung squamous cell carcinoma, have distinct molecular subtypes. The proliferative subtype, enriched with bronchial dysplasia, had decreased expression of an antigen-processing/presentation gene coexpression module in progressive/persistent versus regressive PMLs, suggesting a functional impact of these genes on immune evasion. In this study, we performed miRNA sequencing, miRNA in situ hybridization, and spatial proteomics of bronchial biopsies from patients at high risk for lung cancer. An miRNA–gene network analysis identified hsa-miR-149-5p as a potential regulator of the antigen presentation gene module. Staining on adjacent biopsy tissue showed that hsa-miR-149-5p was predominantly expressed in the epithelium and upregulated in progressive/persistent proliferative lesions. Targets of this miRNA, the transcriptional coactivator of MHC-I gene expression, NLRC5, and the genes it regulates, were downregulated in these lesions. Decreased NLRC5 expression reduced both IFNγ-induced MHC-I surface expression and CD8 T-cell cytotoxicity in lung squamous cancer cells. In PMLs, basal cells with high levels of NLRC5 were in close spatial proximity to CD8 T cells, suggesting that these cells exhibit increased functional MHC-I gene expression in vivo. These findings indicate a functional role for hsa-miR-149-5p in PML progression/persistence and suggest this axis as a potential therapeutic target for PML immunomodulation."
  abstract: ""

- author: "Erin Morrow"
  title: "Subliminal backdoors to forgetting emotional memories"
  journal: "Trends in Cognitive Sciences"
  date: "March 2023"
  citation: "Greer, J., Morrow, E., & Clewett, D. (2023). Subliminal backdoors to forgetting emotional memories. Trends in Cognitive Sciences, 27(3), 222-223."
  doi: "https://doi.org/10.1016/j.tics.2022.12.009"
  category: "Neuroscience"
  disciplines: "Cognitive psychology"
  summary: "Weakening negative memories often requires first remembering those events. To bypass this distressing process, a team of researchers (Zhu and colleagues) had participants suppress unrelated memories - and prompted them to subliminally recall negative memories between them. This 'amnesic shadow' technique brings new possibilities for treatment, as well as important questions, to light."
  abstract: "Weakening negative memories often requires first remembering those events. To bypass this distressing process, Zhu et al. elicited forgetting by subliminally reactivating negative memories near in time to retrieval suppression of unrelated memories. Casting an amnesic shadow over harmful, reactivated memories thereby brings new therapeutic possibilities, and questions, to light."

- author: "Erin Morrow"
  title: "Distortion of overlapping memories relates to arousal and anxiety"
  journal: "Cognitive, Affective, & Behavioral Neuroscience"
  date: "10/8/2024"
  citation: "Morrow, E., & Clewett, D. (2025). Distortion of overlapping memories relates to arousal and anxiety. Cognitive, Affective, & Behavioral Neuroscience, 25(1), 154-172."
  doi: "https://doi.org/10.3758/s13415-024-01229-1"
  category: "Neuroscience"
  disciplines: "Cognitive psychology, cognitive neuroscience"
  summary: "Everyday experiences often overlap, which can make it difficult to maintain unique memories. One helpful way that our brain enhances uniqueness is by exaggerating small differences between memories - a process called memory repulsion. In our experiment, we tested how memory repulsion might affect emotional memories. Participants learned pairs of items that went together: a household object and a specific face. Each object had two different-colored versions (e.g., a light red and dark red backpack) that were paired with separate faces, allowing us to create overlapping memories. Importantly, we played either a normal tone or an irritating burst of white noise immediately before one of the item pairs (e.g., the dark red backpack). This happened over several learning rounds. To measure distortions in memory, participants were tested on the color of the objects. We found that participants who were more reactive to the white noise (i.e., showed greater pupil dilation) recalled the two object versions' colors as more similar than they actually were. Also, people who reported higher trait anxiety showed a greater memory attraction effect when one of the objects had been linked to the aversive white noise. Our findings suggest that memories of similar ordinary and aversive events may blur together over repeated experiences, especially in people who show greater reactivity and symptoms of anxiety."
  abstract: "Everyday experiences often overlap, challenging our ability to maintain distinct episodic memories. One way to resolve such interference is by exaggerating subtle differences between remembered events, a phenomenon known as memory repulsion. Here, we tested whether repulsion is influenced by emotional arousal, when resolving memory interference is perhaps most needed. We adapted an existing paradigm in which participants repeatedly studied object–face associations. Participants studied two different-colored versions of each object: a to-be-tested “target” and its not-to-be-tested “competitor” pair mate. The level of interference between target and competitor pair mates was manipulated by making the object colors either highly similar or less similar, depending on the participant group. To manipulate arousal, the competitor object–face associations were preceded by either a neutral tone or an aversive and arousing burst of white noise. Memory distortion for the color of the target objects was tested after each study round to examine whether memory distortions emerge after learning. We found that participants with greater sound-induced pupil dilations, an index of physiological arousal, showed greater memory attraction of target colors towards highly similar competitor colors. Greater memory attraction was also correlated with greater memory interference in the last round of learning. Additionally, individuals who self-reported higher trait anxiety showed greater memory attraction when one of the overlapping memories was associated with something aversive. Our findings suggest that memories of similar neutral and arousing events may blur together after repeated exposures, especially in individuals who show higher arousal responses and symptoms of anxiety."

- author: "Erin Morrow"
  title: "Enhanced recognition memory for emotional nonverbal sounds"
  journal: "Memory"
  date: "3/5/2025"
  citation: "Morrow, E., Shepardson, S., & Hamann, S. (2025). Enhanced recognition memory for emotional nonverbal sounds. Memory, 33(4), 461-473."
  doi: "https://doi.org/10.1080/09658211.2025.2472969"
  category: "Neuroscience"
  disciplines: "Cognitive psychology"
  summary: "People often remember emotional events better than neutral events. However, this effect has mostly been studied using pictures, words, or scenes. In contrast, little is known about emotion's effects on memory for sounds in the environment. We also don't know whether the information surrounding emotional sounds is better remembered, or whether emotional sounds are merely more familiar to us. In this experiment, participants heard 6-second clips of both negative sounds (e.g., a crying baby) and neutral sounds (e.g., footsteps). After a 15-minute delay, participants then heard these sounds again, in addition to similar new sounds. In this surprise phase, they were asked to rate their memory for the sound on a 6-point scale ranging from \"definitely new\" to \"definitely old.\" As predicted, participants recognized negative sounds more often than neutral sounds - especially negative sounds that were more intense. This effect was specific to memory that included surrounding information (e.g., about the participants' feelings or thoughts at the time of the sound's presentation). These findings suggest that key aspects of the emotional memory effect also extend to sounds."
  abstract: "Emotion often enhances memory for emotional stimuli relative to neutral stimuli. This emotional memory enhancement effect has been studied extensively with visual and verbal stimuli, yet little is known regarding emotion’s effects on memory for nonverbal (or environmental) sounds, such as dog snarls and infant cries. Additionally, emotion’s enhancing effects on recognition for visual and verbal stimuli are selective to recollection (recognition with contextual retrieval) rather than familiarity (recognition based on memory strength), but whether this is also the case for nonverbal sounds is unknown. We examined recognition memory for negative and neutral nonverbal sounds, predicting that memory would be enhanced for negative sounds and this enhancement would be specific to recollection. Participants incidentally encoded negative and neutral sounds, and memory was tested with a remember-familiar recognition memory task after a 15-minute delay. As predicted, recognition memory was enhanced for negative sounds, was better for higher versus lower arousal negative sounds, and was specific to recollection. These findings suggest that key aspects of the emotional enhancement effect also extend to nonverbal sounds. We discuss how current theories of emotional memory which focus on memory for visual and verbal stimuli can be extended to accommodate findings with nonverbal emotional auditory stimuli."

- author: "Erin Morrow"
  title: "Dopaminergic processes predict temporal distortions in event memory"
  journal: "Nature Communications"
  date: "3/14/2026"
  citation: "Morrow, E., Huang, R., & Clewett, D. (2026). Dopaminergic processes predict temporal distortions in event memory. Nature Communications."
  doi: "https://doi.org/10.1038/s41467-026-69950-8"
  category: "Neuroscience"
  disciplines: "Cognitive neuroscience, cognitive psychology"
  summary: "Our memories do not simply keep time - they distort it, stretching and compressing the past to reflect the structure of experience. Here, we combined brain imaging with eye-tracking to test whether activation of the dopamine system, known to influence memory and time perception, expands our memory for time between distinct events. Participants viewed series of items while listening to tones that typically repeated over time, but occasionally changed, creating noticeable event boundaries. We found that tone switches significantly activated the ventral tegmental area (VTA; one of the brain's key dopamine hubs), and that when this hub activated more strongly, people reported remembering more time as having passed. At a longer timescale, increased blinking also predicted more time dilation in memory, but only for items that spanned event boundaries. Together, these findings suggest that dopaminergic processes are sensitive to event structure and contribute to distortions of remembered time that may help segment our experience into distinct memories."
  abstract: "Our memories do not simply keep time — they distort it, stretching and compressing the past to reflect the structure of experience. Here, we combined functional magnetic resonance imaging (fMRI; n = 32) with eye-tracking (n = 28) to test whether activation of the dopaminergic system, known to influence encoding and time perception, expands mnemonic representations of time between contextually distinct events. Participants encoded item sequences while listening to tones that typically repeated over time, but occasionally changed, creating salient event boundaries. We found that tone switches significantly activated the ventral tegmental area (VTA), and the magnitude of these responses predicted greater time dilation between item pairs spanning those switches. At a longer timescale, increased blinking also predicted greater time dilation in memory, but only for boundary-spanning item pairs. Together, these findings suggest that dopaminergic processes are sensitive to event structure and contribute to distortions of remembered time that may help segment continuous experience into distinct episodic memories."

