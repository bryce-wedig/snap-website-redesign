- author: "Emily Selland"
  title: "Human Schistosoma exposure risk in rice fields and an exploration of fish species for snail and schistosomiasis biocontrol."
  journal: "PLoS Global Public Health"
  date: "5/1/2025"
  citation: "Alexandra Sack+, Emily K. Selland+, Sidy Bakhoum, Momy Seck, Nicolas Jouanard, Louis Dossou Magblenou, Jason R. Rohr. (2025). Human Schistosoma exposure risk in rice fields and an exploration of fish species for snail and schistosomiasis biocontrol. PLoS Global Public Health. (+ denotes co-first author)"
  doi: "https://doi.org/10.1371/journal.pgph.0004726"
  category: "Ecology"
  disciplines: "global health, ecology"
  summary: "Schistosomiasis is a devastating parasitic disease in which the infectious stage to humans is released by intermediate host snails. The Senegal River Basin (SRB) is a high-risk area for human schistosomiasis and has extensive rice cultivation. However, the risk of disease to people working in rice fields is not well understood. We surveyed for snails in rice field ecosystems and discovered ones infected with human-infectious parasites, establishing a clear occupational exposure risk of disease to rice farmers. Rice-fish co-culturing might reduce this occupational risk to rice farmers if local fish species consume enough snail intermediate hosts to reduce Schistosoma transmission. Thus, we tested local fish species and found that African Bonytongue and Heteroris spp. fish consumed snails (i.e., could be predators of snails in the rice fields). These results indicate that there is exposure to Schistosoma parasites in rice fields in the SRB and introducing local fish to rice fields has promise for reducing this exposure as well as providing a protein source to rice farming families. We encourage future studies to more fully explore the benefits of rice-fish co-culturing in the West Africa."
  abstract: "Schistosomiasis is a devastating parasitic disease in which the infectious stage to humans is released by intermediate host snails. The Senegal River Basin (SRB) is a high-risk area for both urogenital and fecal human schistosomiasis and has extensive rice cultivation. However, occupational risk of schistosomiasis to people working in irrigated rice fields is not well established. We performed intermediate host snail surveys from 2022-2023 in rice fields and irrigation canals throughout the SRB. We discovered human schistosome-shedding snails in rice fields and adjacent irrigation canals during the rice growing and non-growing seasons, establishing a clear occupational exposure risk to rice farmers. Relative to the non-growing season, this risk was higher in the rice growing and harvest season when more people are in the rice fields. Rice-fish co-culturing might reduce this occupational risk to rice farmers if local fish species consume enough snail intermediate hosts to reduce Schistosoma transmission. Our predation trials revealed that local Heterotis niloticus and Hemichromis spp. fish consumed significant numbers of Biomphalaria pfeifferi and Bulinus spp. snails, and separate trials revealed that these same snail species exhibited only moderate avoidance and refuge use responses to fish chemical cues. These results indicate that there is exposure to Schistosoma parasites in rice fields in the SRB and introducing local fish to rice fields has promise for reducing this exposure as well as providing a protein source to rice farming families. We encourage future studies to more fully explore the benefits of rice-fish co-culturing in the West Africa."

- author: "Emily Selland"
  title: "Rice–fish co-culturing reduces schistosomiasis risk and increases yields and incomes"
  journal: "Nature Sustainability"
  date: "5/11/2026"
  citation: "Emily K. Selland, Nicolas Jouanard, Amadou Guisse, Momy Seck, Andrea J. Lund, David López-Carr, Alexandra Sack, Louis Dossou Magblenou, Giulio De Leo, Molly J. Doruska, Christopher B. Barrett, Jason R. Rohr. (In Press) Rice-Fish Co-Culturing for Sustainability, Food Security, and Disease and Poverty Reduction. Nature Sustainability."
  doi: "https://doi.org/10.1038/s41893-026-01833-8"
  category: "Ecology"
  disciplines: "global health, agricultural sustainability"
  summary: "Over 140 million households cultivate rice worldwide. However, rice production can be unsustainable, and rice-farming families may face increased risk of acquiring schistosomiasis, a devastating disease transmitted by freshwater snails. Using data from 405 households in rural northern Senegal, we show that children in rice-farming households had higher prevalence and intensities of disease than non-farming peers. To address this environmental-health challenge, we integrated native fish, Nile Tilapia and African Bonytongue, into rice fields. The fish grew, suppressed insects and rice pests, improved soil nutrients, and boosted rice yields by >25% with an economic benefit (and a high benefit-to-cost ratio signaling strong potential for farmers to take up the innovation). Hence, low-input rice–fish co-culturing offers a sustainable planetary health solution that simultaneously improves agricultural outcomes and rural livelihoods, while reducing disease transmission risks."
  abstract: "Over 140 million households cultivate rice worldwide. However, rice production contributes to exceedance of planetary boundaries, such as freshwater use and biogeochemical flows. In addition, rice-farming families may face increased risk of contracting schistosomiasis, a parasitic disease transmitted by freshwater snails that contributes to reinforcing cycles of poverty and disease. Here, using data from 405 households in rural northern Senegal, we show that children in rice-farming households had higher Schistosoma mansoni prevalence and Schistosoma haematobium intensities than non-farming peers. To address this environmental health challenge, we integrated native Nile tilapia (Oreochromis niloticus) and African bonytongue (Heterotis niloticus) into rice fields. The fish thrived, suppressed insects and snail pests, improved soil nutrients and boosted rice yields by >25% with a net benefit of US$1,805–3,415 ha−1 yr−1 (a benefit-to-cost ratio of 7.42). Hence, low-input rice–fish co-culturing offers a sustainable planetary health solution that simultaneously improves agricultural outcomes and rural livelihoods while reducing disease transmission risks."

