- author: "Priyam Joshi"
  title: "Digital segmentation to combat public health emergencies: the role of demographic, psychographic, and health status criteria on downloads of smartphone-based digital health interventions — a mixed methods study"
  journal: "BMC Digital Health"
  date: "6/5/2026"
  citation: "Ollier, J., Joshi, P., Mishra, R., Fleisch, E., Wangenheim, F. V., Salamanca-Sanabria, A., Mair, J. L., & Kowatsch, T. (2026). Digital segmentation to combat public health emergencies: The role of demographic, psychographic, and health status criteria on downloads of smartphone-based digital health interventions—A mixed methods study. BMC Digital Health, 4(1), 38. https://doi.org/10.1186/s44247-026-00271-y"
  doi: "https://doi.org/10.1186/s44247-026-00271-y"
  category: "Public Health"
  disciplines: "Public health emergencies, digital health"
  summary: "The aim of this study was to understand who is most likely to download and use smartphone-based digital health interventions during public health emergencies such as the COVID-19 pandemic, and what factors drive their engagement. Using data from a large-scale Facebook recruitment campaign and a public survey, we found that middle-aged women were the most frequent users, while messages focused on loneliness, mental wellbeing, and physical activity generated the greatest interest. The study also showed that people who perceived a higher risk from COVID-19 and those with greater trust in institutions were more likely to engage with digital health tools. These findings suggest that digital health interventions can play an important role in future health crises, but their impact depends on tailoring communication strategies to the needs and motivations of different population groups to ensure equitable access and uptake."
  abstract: ""

- author: "Bryce Wedig"
  title: "The Roman View of Strong Gravitational Lenses"
  journal: "The Astrophysical Journal"
  date: "6/5/2025"
  citation: "Wedig, B., Daylan, T., Birrer, S., Cyr‑Racine, F.-Y., Dvorkin, C., Finkbeiner, D. P., Huang, A., Huang, X., Karthik, R., Khadka, N., Natarajan, P., Nierenberg, A. M., Peter, A. H. G., Pierel, J. D. R., Tang, X. T. Z., & Wechsler, R. H. (2025). The Roman view of strong gravitational lenses. The Astrophysical Journal, 986(1), 42. https://doi.org/10.3847/1538-4357/adc24f"
  doi: "https://ui.adsabs.harvard.edu/link_gateway/2025ApJ...986...42W/doi:10.3847/1538-4357/adc24f"
  category: "Physics"
  disciplines: "Astrophysics"
  summary: "Galaxy–galaxy strong gravitational lenses (\"strong lenses\") are the rare, near-perfect alignment of galaxies in the sky (one right behind the other). The mass of the closer galaxy bends the light from the distant galaxy around it, dramatically distorting and magnifying it. Strong lenses can help solve one of the biggest questions in astrophysics: the nature of \"dark matter\" which comprises 85% of the matter in the Universe. But today, not many of these rare systems are known, and very few have been observed with high-resolution space telescopes. The Nancy Grace Roman Space Telescope (\"Roman\"), scheduled for launch in late August of 2026, will play a transformative role by discovering over 100,000 strong lenses and capturing high-resolution, multi-band imaging data of them. We build a survey and image simulation package to predict what Roman's strong lenses will look like. In particular, we investigate the effect of a significant systematic, the variation of the \"point spread function,\" on what Roman's strong lenses will tell us about dark matter."
  abstract: "Galaxy─galaxy strong gravitational lenses can constrain dark matter models and the Lambda cold dark matter cosmological paradigm at subgalactic scales. Currently, there is a dearth of images of these rare systems with high signal-to-noise ratio (SNR) and angular resolution. The Nancy Grace Roman Space Telescope (hereafter Roman), scheduled for launch in late 2026, will play a transformative role in strong-lensing science with its planned wide-field surveys. With its remarkable 0.281 square degree field of view and diffraction-limited angular resolution of ~0 .″ 1, Roman is uniquely suited to characterizing dark matter substructure from a robust population of strong lenses. We present a yield simulation of detectable strong lenses in Roman's planned High Latitude Wide Area Survey (HLWAS). We simulate a population of galaxy─galaxy strong lenses across cosmic time with cold dark matter subhalo populations, select those detectable in the HLWAS, and generate simulated images accounting for realistic Wide Field Instrument detector effects. For a fiducial case of single 146 s exposures, we predict around 160,000 detectable strong lenses in the HLWAS, of which about 500 will have sufficient SNR to be amenable to detailed substructure characterization. We investigate the effect of variation of the point-spread function across Roman's field of view on detecting individual subhalos and the suppression of the subhalo mass function at low masses. Our simulation products are available to support strong-lens science with Roman, such as training neural networks and validating dark matter substructure analysis pipelines."

- author: "Connor Schmidt"
  title: "Impact of guest orientation in host-guest supramolecular hydrogels."
  journal: "ACS Macro Letters"
  date: "2025"
  citation: "Addonizio, C. J., Braegelman, A. S., Schmidt, C. R., Ollier, R. C., Antwi, A. A., Su, B., Farshad, M., Whitmer, J. K., & Webber, M. J. (2025). Impact of guest orientation in host-guest supramolecular hydrogels. ACS Macro Letters, 14(1), 8–13."
  doi: "https://doi.org/10.1021/acsmacrolett.4c00531"
  category: "Chemical Engineering, Chemistry"
  disciplines: "Supramolecular Chemistry"
  summary: "Short cylinder/ring shaped molecules (hosts) paired with molecules that fit well in their cavities (guests) are used to connect string like polymeric molecules to make hydrogels (jello-like, high water quantity materials) with special material properties, such as self-healing in which the material can be cut in half but then reform when put back together due the the pairs of molecules being able to come apart and reattach. This paper examines the effects of the orientation of the guests on the material properties, because when attached to polymeric molecules the guest can only interact with the host from one side, so orientation becomes an important factor in the design of hydrogels with ideal properties for different applications."
  abstract: ""

