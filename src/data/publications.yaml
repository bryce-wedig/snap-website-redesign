  category: "Psychology"
  disciplines: "Psychology, Digital Health"
  summary: "https://canva.link/itestinfographic - People with schizophrenia are more likely to miscalculate how well they're doing on everyday tasks, sometimes overestimating their memory or social skills, sometimes underestimating them. This self-awareness problem, called introspective accuracy, predicts daily functioning even more than actual cognitive ability does. Until now, nobody had really tried to fix it directly. iTEST is a 16-week program with two parts. Participants do short daily exercises on a phone app where they complete a memory or emotion-recognition task, guess how well they did, and get feedback on their accuracy. Alongside this, they meet weekly with a coach for the first six weeks, with occasional booster sessions after that. The pilot included 60 people with schizophrenia or schizoaffective disorder across UTD and UCSD, with no control group since this was an early-stage trial. Engagement was strong, with 87 percent retention and completion, and 86 percent of participants reporting they were very satisfied. Improvements on the trained phone tasks were large, and the gains transferred to two of three untrained tasks, suggesting they were getting better at self-monitoring more broadly. Positive symptoms like delusions and depression also decreased, and interpersonal relationships improved. The main limitations are the lack of a control group and a relatively stable outpatient sample, so the randomized trial of 201 participants already underway will be the real test of the interventions potential."
  abstract: "Study Design Improving Thinking through Everyday Self-Assessment Training combines 16 weeks of daily mobile task-based training in IA with weekly individual coaching in applying IA to everyday behaviors. Sixty individuals with diagnoses of schizophrenia or schizoaffective disorder participated in an open trial of iTEST with assessments at baseline, 8, 12, and 16 weeks. Primary outcomes included IA on 2 trained tasks (mobile verbal learning and facial emotion recognition tests) and 3 untrained tasks (verbal memory, emotion recognition, and executive functioning). Study Results Improving Thinking through Everyday Self-Assessment Training showed strong feasibility, retaining 86.7% of participants, and strong adherence with an average daily mobile-training completion rate of 87%. In linear-mixed models with intent-to-treat data, statistically significant IA improvements were observed over time in both trained tasks and in 2 of the 3 untrained tasks (Cohen’s d’s = 0.5-1.28). Significant improvements were also observed in secondary outcomes of real-world function, positive symptoms, and depression. Conclusions This project provides the first data, to our knowledge, to demonstrate that IA in schizophrenia can be improved. Improving Thinking through Everyday Self-Assessment Training also represents one of just a few blended digital health interventions, including remote cognitive training, and may therefore serve as a blueprint for future intervention development."

- author: "Sarah Berretta"
  title: "The role of diagnostic labels in shaping first impressions of individuals with schizophrenia"
  journal: "Journal for Psychiatric Research"
  date: "10/1/2025"
  citation: "Berretta, S. A., Bennett-Leleux, L., Albrecht, K., & Pinkham, A. E. (2025). The role of diagnostic labels in shaping first impressions of individuals with schizophrenia. Journal of psychiatric research, 190, 190–198. https://doi.org/10.1016/j.jpsychires.2025.07.028"
  doi: "10.1016/j.jpsychires.2025.07.028"
  category: "Psychology"
  disciplines: "Psychology, Illness stigma"
  summary: "We showed 222 college students short 10-second video clips of people with schizophrenia and people without schizophrenia. Each video was paired with either the correct label, no label, or the wrong label (for example, a healthy person labeled as having schizophrenia). After each clip, students rated how likeable, trustworthy, attractive, and approachable the person seemed, as well as how comfortable they would feel sitting near them or living nearby. We found that people with schizophrenia were viewed more negatively in first impressions, even before any diagnosis was mentioned. These negative impressions remained regardless of the label shown. However, when someone was correctly identified as having schizophrenia, students felt even less comfortable sitting near them or living close to them. Similarly, healthy people who were incorrectly labeled as having schizophrenia were also judged more negatively. Students who knew more about schizophrenia tended to have slightly more positive attitudes and lower stigma, but the effect was small. This suggests that education alone may not be enough to reduce stigma toward schizophrenia. We takeaway, then, the idea that anti-stigma efforts need to do more to address the quick, automatic judgments people make when first meeting someone."
  abstract: "Diagnostic disclosure can impact social perceptions during first impressions. We aimed to explore the effect of diagnostic labeling on first impressions of individuals with schizophrenia. In a 2x3 factorial design, we showed 18 videos of individuals with schizophrenia or healthy volunteers paired with three randomly assigned labeling conditions (true label, mislabel, no label) to 222 undergraduate students who rated each video using the First Impressions Scale (FIS). While the main effect of labeling was not significant for any FIS item, individuals with schizophrenia were consistently rated more negatively than healthy volunteers across all FIS items (p < .05), with partial eta-squared effect sizes ranging from small to moderate. Significant interactions between group and labeling conditions were found for attractiveness, willingness to live nearby, and comfort sitting nearby, even after controlling for knowledge about schizophrenia. Relative to the unlabeled condition, when individuals with schizophrenia were mislabeled as healthy, their ratings improved, sometimes reaching the level of correctly labeled healthy individuals. Conversely, accurate diagnostic labeling of schizophrenia further lowered impressions on certain items, particularly those related to social comfort and behavioral intent. These findings suggest that first impressions of individuals with schizophrenia are shaped primarily by nonverbal and behavioral cues that may differ between affected and unaffected individuals but that diagnostic disclosure can also alter some of these impressions by further lowering impressions of individuals with SCZ and incorrectly labeled healthy individuals."

- author: "Kevin Dimmitt"
  title: "Optical and electrochemical characteristics of organic pigments derived from naturally occurring fungi"
  journal: "Organic Photonic Materials and Devices XXVIII"
  date: ""
  citation: "Dimmitt, K., Zhang, X., Duggan, N., Nelson, J., MacGill, B., Ullah, A., ... & Ostroverkhova, O. (2026, March). Optical and electrochemical characteristics of organic pigments derived from naturally occurring fungi. In Organic Photonic Materials and Devices XXVIII (Vol. 13893, pp. 70-77). SPIE."
  doi: "https://doi.org/10.1117/12.3085058"
  category: "Physics"
  disciplines: "Physics, Electrical Engineering"
  summary: "Semiconductors are used in a lot of modern technology, such as computer chips, LEDs, and solar cells. Most of these materials need to be mined out of the ground, but there is a lot of research into organic (carbon-based) materials that can be used in these technologies. Organics have already seen some success with OLED screens (the 'O' means organic), but even these organics are often derived from fossil fuel products. This work highlights some recent work from our multidisciplinary collaboration at OSU studying pigments extracted from Oregon-native fungi as semiconductor materials, particularly in terms of how these materials interact with light and electricity. We show some of the first evidence of a particular quantum state that is a combination between light and matter that has been studied to improve the performance of organic semiconductors."
  abstract: ""

- author: "Sofie Strompf"
  title: "Secretory mitophagy: an extracellular vesicle-mediated adaptive mechanism for cancer cell survival under oxidative stress"
  journal: "Frontiers in Cell and Developmental Biology"
  date: "1/30/2025"
  citation: "Gade, P. V., Rivera, A. V. R., Hasanzadah, L., Strompf, S., Philipson, T. R., Gadziala, M., Tyagi, A., Bandam, A., Gabbireddy, R., Kashanchi, F., Haymond, A., Liotta, L. A., & Howard, M. A. (2025). Secretory mitophagy: an extracellular vesicle-mediated adaptive mechanism for cancer cell survival under oxidative stress. Frontiers in cell and developmental biology, 12, 1490902. https://doi.org/10.3389/fcell.2024.1490902"
  doi: "https://doi.org/10.3389/fcell.2024.1490902"
  category: "Biological and Chemical Sciences"
  disciplines: "Molecular oncology, Cellular stress and survival"
  summary: "Cancer cells are often exposed to stressful conditions that would normally damage or kill healthy cells. One major source of this stress is damage to the mitochondria, the structures responsible for producing energy within the cell. Under normal conditions, cells remove damaged mitochondria through a recycling process called mitophagy. However, the pathway that regulates this process can become overwhelmed under extreme stress, including the conditions commonly seen in cancer. When the mitophagy pathway is overwhelmed, cells typically undergo programmed cell death, or apoptosis. Cancer cells, however, are often able to evade apoptosis. Here, we describe a newly identified cancer cell survival mechanism called secretory mitophagy, in which cancer cells package and expel damaged mitochondrial material in particles known as extracellular vesicles. By doing so, they bypass the overwhelmed mitophagy system and maintain cell survival. Through secretory mitophagy, cancer cells reduce cellular stress, preserve energy production, and improve their chances of survival. These findings reveal a new way in which cancer cells adapt to harsh conditions and resist damage, including damage caused by cancer therapies. Understanding this pathway could support the future development of treatments that make tumors more vulnerable to stress and improve the effectiveness of existing therapies by blocking secretory mitophagy."
  abstract: "Mitophagy is a critically important survival mechanism in which toxic, aged, or defective mitochondria are segregated into mitophagosomes, which shuttle the damaged mitochondrial segments to the lysosome and proteasome for destruction. Cancer cells rely on mitophagy under conditions of high oxidative stress or increased energy demand. Oxidative stress can generate a large volume of damaged mitochondria, overwhelming lysosomal removal. Accumulated damaged mitochondria are toxic and their proper removal is crucial for maintaining mitochondrial health. We propose a new cancer cell mechanism for survival that is activated when the demand for segregating and eliminating damaged mitochondria exceeds the capacity of the lysosome or proteasome. Specifically, we show that tumor cells subjected to oxidative stress by carbonyl cyanide-3-chlorophenylhdrazone (CCCP) eliminate damaged mitochondria segments by bypassing the lysosome to export them outside the cell via extracellular vesicles (EVs), a process termed \"secretory mitophagy.\" PINK1, the initiator of mitophagy, remains associated with the damaged mitochondria that exported in EVs. Using several types of cancer cells, we show that tumor cells treated with CCCP can be induced to switch over to secretory mitophagy by treatment with Bafilomycin A1, which blocks the fusion of mitophagosomes with lysosomes. Under these conditions, an increased number of PINK1 + EVs are exported. This is associated with greater cell survival by a given CCCP dose, enhanced mitochondrial ATP production, and reduced mitochondrial oxidative damage (membrane depolarization). Our data supports the hypothesis that secretory mitophagy is a previously unexplored process by which cancer cells adapt to survive therapeutic or hypoxic stress. Ultimately, our findings may inform new prevention strategies targeting pre-malignant lesions and therapeutic approaches designed to sensitize tumor cells to oxidative stress-inducing therapies."

