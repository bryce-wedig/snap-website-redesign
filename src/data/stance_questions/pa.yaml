  question: >-
    PFAS chemicals are widely used in consumer products but have raised health concerns due to their persistence in the environment and humans, and some Pennsylvanian legislators are considering restrictions on its use, such as in House Bill 2145. Should Pennsylvania restrict PFAS in consumer products? What scientific evidence would you use to inform your decision?
