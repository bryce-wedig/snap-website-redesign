  tag: Artificial Intelligence

- id: mn-q5
  question: >-
    In 2025 alone, the National Institute on Health (NIH) awarded over $700 million for research grants and contracts to Minnesota universities, which directly supported over 7,000 jobs and $1.79 billion of economic activity in Minnesota. What policies, if any, do you plan to implement or support regarding funding for continued science research either at the state or federal level?
  tag: Science Funding

- id: mn-q6
  question: >-
    Fatal drug overdoses in Minnesota have significantly declined in recent years, representing a 28% drop from a record peak of 1,392 overdose deaths in 2022. However, compared to White Minnesotans, Indigenous Minnesotans are 7 to 15 times more likely to experience a fatal drug overdose, while Black Minnesotans are 2 to 3 times more likely to die from a drug-related overdose. What policies, if any, do you support to continue the downward trend of overdose deaths for Minnesotans?
  tag: Public Health