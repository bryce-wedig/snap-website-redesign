- id: wi-q1
  question: >-
    America has a growing artificial intelligence (AI) industry, supporting cutting edge innovation and reshaping businesses, but raising concerns about education, ownership, and security. Application of AI technology has increased the demand placed on data centers, controversial for their resource use (such as water and land) and raising utility costs. What are your policy positions in regards to data centers and AI? What sources of evidence informed these positions?
  tag: Artificial Intelligence

- id: wi-q2
  question: >-
    Making the US competitive in the bioeconomy (using technology applied to renewable biological resources to produce food, energy and industrial goods) requires innovation and investments in business, academia and government. Please describe policies you will support, if any, that relate to workforce development in Wisconsin’s strengths such as agriculture, biotechnology, and energy; and explain their rationale.
  tag: Jobs and Workforce

- id: wi-q3
  question: >-
    Wisconsin's public K-12 education systems have seen a significant decline in the past two decades, with more than 600 public schools closing and statewide student enrollment dropping 7%. These impacts have been especially pronounced in Wisconsin's many rural counties, where opportunities for STEM education are already fewer. What policies, if any, would you support to improve K-12 education for students across Wisconsin?
  tag: K-12 Science Education

- id: wi-q4
  question: >-
    What do you see as the purpose of the department of health and human services and what skill sets and values do you set as criteria when considering who to appoint to this state department?
  tag: Public Health

- id: wi-q5
  question: >-
    If elected, in what capacities would you refer to scientists when you are deciding how to vote on a policy?
  tag: Trust in Science

- id: wi-q6
  question: >-
    In 2025 alone, the National Institute on Health (NIH) awarded over $575 million for research grants and contracts to Wisconsin universities and hospitals, which directly supported over 6,500 jobs and generated an estimated $1.37 billion of economic activity. However, federal funding cuts for science research and agencies like the NIH and National Science Foundation leave the future for scientific research less assured. What policies, if any, do you support or plan to implement to promote continued funding for scientific research?
  tag: Science Funding

- id: wi-q7
  question: >-
    Wisconsin has faced an increasing number of infectious disease outbreaks in recent years, for instance with rising numbers of measles and avian influenza cases that threaten human health and agricultural industry, respectively. What policies, if any, would you support to manage the burden of infectious disease in the state and respond to future outbreaks?
  tag: Public Health